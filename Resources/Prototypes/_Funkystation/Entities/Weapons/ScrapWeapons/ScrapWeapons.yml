- type: entity
  name: metal handle
  parent: BaseItem
  id: MetalHandle
  description: A piece of a Metal that has been shaped into a Handle.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/ScrapWeapons/Handle.rsi
    state: icon
  - type: Tag
    tags:
    - MetalHandle
  - type: Item
    size: Normal
  - type: Construction
    graph: MetalHandleGraph
    node: metalhandle

- type: entity
  name: metal shaft
  parent: BaseItem
  id: MetalShaft
  description: A incomplete metal piece.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/ScrapWeapons/Shaft.rsi
    state: icon
  - type: Tag
    tags:
    - MetalShaft
  - type: Item
    size: Normal
  - type: Construction
    graph: MetalShaftGraph
    node: metalshaft

- type: entity
  name: metal blade
  parent: BaseItem
  id: MetalBlade
  description: A Crude Sharp piece of metal that has been bent, It doesn't look too sharp.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/ScrapWeapons/Blade.rsi
    state: icon
  - type: Item
    size: Normal
  - type: Construction
    graph: MetalBladeGraph
    node: metalsharp

- type: entity
  name: metal club
  parent: [BaseItem, BaseMinorContraband]
  id: MetalClub
  description: A Crude Makeshift Metal Club. This would probably give you some fractures.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/ScrapWeapons/metalclub.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 5
    soundHit:
      collection: ScrapImpact
  - type: Construction
    graph: MetalClubGraph
    node: metalclub
  - type: Item
    size: Normal

- type: entity
  name: metal pole
  parent: [BaseItem, BaseMinorContraband]
  id: MetalPole
  description: Who do you think you are? A Tider Monk?.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/ScrapWeapons/pole.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Structural: 5
    soundHit:
      collection: ScrapImpact
  - type: MeleeThrowOnHit
    speed: 8 # Funky change - 30 -> 20 since 30 is incredibly fast, fast enough to frequently clip people through walls
    distance: 4
  - type: Item
    size: Huge
