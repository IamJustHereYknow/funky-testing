- type: constructionGraph
  id: MetalHandleGraph
  start: start
  graph:
    - node: start
      edges:
      - to: metalhandle
        steps:
        - material: Steel
          amount: 3
          doAfter: 4
    - node: metalhandle
      entity: MetalHandle

- type: constructionGraph
  id: MetalShaftGraph
  start: start
  graph:
    - node: start
      edges:
      - to: metalshaft
        steps:
        - material: Steel
          amount: 3
          doAfter: 4
    - node: metalshaft
      entity: MetalShaft

- type: constructionGraph
  id: MetalBladeGraph
  start: start
  graph:
    - node: start
      edges:
      - to: metalsharp
        steps:
        - material: Steel
          amount: 3
          doAfter: 4
    - node: metalsharp
      entity: MetalBlade

- type: constructionGraph
  id: MetalClubGraph
  start: start
  graph:
    - node: start
      edges:
      - to: metalclub
        steps:
        - tag: MetalHandle
          name: Metal Handle
          icon:
            sprite: _Funkystation/Objects/ScrapWeapons/Handle.rsi
            state: icon
        - tag: MetalShaft
          name: Metal Shaft
          icon:
            sprite: _Funkystation/Objects/ScrapWeapons/Shaft.rsi
            state: icon
          doAfter: 4
    - node: metalclub
      entity: MetalClub

- type: constructionGraph
  id: MetalPoleGraph
  start: start
  graph:
    - node: start
      edges:
      - to: metalpoleA
        steps:
        - tag: MetalShaft
          name: Metal Shaft
          icon:
            sprite: _Funkystation/Objects/ScrapWeapons/Shaft.rsi
            state: icon

        - tag: MetalShaft
          name: Metal Shaft
          icon:
            sprite: _Funkystation/Objects/ScrapWeapons/Shaft.rsi
            state: icon
          doAfter: 4

    - node: metalpoleA
      entity: UnfinishedMetalPole
      edges:
      - to: metalpole
        steps:
        - tool: Welding
          doAfter: 8

    - node: metalpole
      entity: MetalPole
